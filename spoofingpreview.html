var onlongtouch; 
var timer;
var touchduration = 1; //length of time we want the user to touch before we do something
//y();
function touchstart(e) {
    y();
    e.preventDefault();
    if (!timer) {
        timer = setTimeout(onlongtouch, touchduration);
    }
}

function touchend() {
    //stops short touches from firing the event
    if (timer) {
        clearTimeout(timer);
        timer = null;
    }
}

onlongtouch = function() { 
    timer = null;
